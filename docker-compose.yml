services:
  app:
    image: ${RELAY_IMAGE:-ghcr.io/azodik/relay:latest}
    env_file: .env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${RELAY_HTTP_PORT:-8080}:8080"
    volumes:
      - relay-storage:/var/www/html/storage

  queue:
    image: ${RELAY_IMAGE:-ghcr.io/azodik/relay:latest}
    command: php artisan queue:work --queue=default,webhooks --tries=3 --timeout=90
    env_file: .env
    environment:
      RELAY_RUN_MIGRATIONS: "false"
    depends_on:
      - app
      - redis
    volumes:
      - relay-storage:/var/www/html/storage

  mariadb:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-relay}
      MYSQL_USER: ${DB_USERNAME:-relay}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - relay-mariadb:/var/lib/mysql

  redis:
    image: redis:7-alpine

volumes:
  relay-mariadb:
  relay-storage:
