# Azodik Relay is only ever terminated in plain HTTP by this container. Forward
# whatever scheme a real upstream reverse proxy reports via X-Forwarded-Proto
# so Laravel's TrustProxies middleware can tell HTTP and HTTPS apart, and
# fall back to nginx's own scheme when no proxy sits in front.
map $http_x_forwarded_proto $relay_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Matches php.ini's post_max_size — attachments are validated up to
    # 30 MB before base64 encoding, which inflates the request body further.
    client_max_body_size 45m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_PROTO $relay_forwarded_proto;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
